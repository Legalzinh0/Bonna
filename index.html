<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5dfb8">
  <meta name="description" content="Bonna — salgados e delícias. Encontre nosso cardápio, iFood e WhatsApp.">
  <title>Bonna | Sabores que fazem parte do seu dia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page" aria-label="Links oficiais da Bonna">
    <!-- A arte original fica intacta. Os links transparentes são posicionados por cima. -->
    <img class="artwork"
      src="Cardápio Bonna_ Sabores que Fazem Parte.png"
      alt="Bonna Salgados e Delícias — Cardápio Digital, iFood, WhatsApp, Instagram e localização"
      width="928" height="1648">

    <nav class="hotspots" aria-label="Links da Bonna">
      <!-- Troque # pelo endereço real de cada destino. -->
      <a class="hotspot" style="--top:37.25%;--height:7.65%" href="#" data-link="cardapio"
         aria-label="Cardápio Digital" title="Cardápio Digital"></a>
      <a class="hotspot" style="--top:46.05%;--height:7.65%" href="#" data-link="ifood"
         aria-label="Peça no iFood" title="Peça no iFood"></a>
      <a class="hotspot" style="--top:54.85%;--height:7.65%" href="#" data-link="whatsapp"
         aria-label="Fale no WhatsApp" title="Fale no WhatsApp"></a>
      <a class="hotspot" style="--top:63.85%;--height:7.65%" href="#" data-link="instagram"
         aria-label="Nosso Instagram" title="Nosso Instagram"></a>
      <a class="hotspot" style="--top:73.05%;--height:7.65%" href="#" data-link="localizacao"
         aria-label="Nossa Localização" title="Nossa Localização"></a>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
